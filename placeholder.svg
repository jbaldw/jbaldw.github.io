<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1740"/>
      <stop offset="50%" stop-color="#0F0D29"/>
      <stop offset="100%" stop-color="#2a1f5e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#A78BFA" stroke-width="0.5" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <g opacity="0.6">
    <text x="50%" y="48%" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" fill="#A78BFA" letter-spacing="6">PROJECT</text>
    <text x="50%" y="58%" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#b2bed1" letter-spacing="3">screenshot placeholder</text>
  </g>
</svg>
